name: Build Models Data

on:
  push:
    branches:
      - main
    paths:
      - "risultato_finale (1).xlsx"
      - "url.xlsx"
      - "scripts/build_data.py"
      - ".github/workflows/build-data.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:- uses: actions/checkout@v4
  with:
    fetch-depth: 0
       
      
      - name: Set up Python
       uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
      
      - name: Build data
        run: |
          python3 scripts/build_data.py "risultato_finale (1).xlsx" url.xlsx
      
       - name: Commit and push changes
     run: |
       git config --local user.email "action@github.com"
       git config --local user.name "GitHub Action"
       git pull --rebase origin main || true
       git add src/data/
       git diff-index --quiet HEAD || git commit -m "Auto-generate models data from Excel sources"
       git push origin main
